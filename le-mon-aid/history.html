<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase History · Le Mon-Aid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="screen__bg"></div>
    <div class="panel"></div>
    <h1 class="brand">Le Mon-Aid</h1>
    <p class="plan">FREE PLAN</p>
    <div class="logo"><img src="assets/logo.png" alt="Le Mon-Aid logo"></div>

    <div class="card card--lime" style="--x:37px;--y:169px;--h:746px"></div>
    <h2 class="bar bar--green" style="--y:179px">Purchase History</h2>
    <a class="abs close" href="home.html" aria-label="Close" style="--x:349px;--y:179px;--w:40px;--h:40px"><img src="assets/close-history.svg" alt=""></a>

    <ul class="rows" style="--y:217px;--w:322px;--cols:45px 140px;--pad:28px">
      <li><span>Food</span><time datetime="2025-12-16">16 December 2025</time><span>Rp 1.000.000</span><img class="rule" src="assets/line-history.svg" alt=""></li>
      <li><span>Food</span><time datetime="2025-12-07">7 December 2025</time><span>Rp 700.000</span><img class="rule" src="assets/line-history.svg" alt=""></li>
      <li><span>Food</span><time datetime="2025-11-29">29 November 2025</time><span>Rp 30.000</span><img class="rule" src="assets/line-history.svg" alt=""></li>
    </ul>

    <div class="scroll-track"></div>
    <div class="scroll-thumb"></div>

    <a class="btn-green" href="#add-spending" style="--x:146px;--y:852px">Add Spending</a>
    <div class="leaf" style="--x:234px;--y:813px;--w:71.863px"><img src="assets/logo.png" alt=""></div>

    <!-- Popup: Add spending -->
    <div class="modal" id="add-spending" role="dialog" aria-label="Add spending">
      <a class="modal__scrim" href="#" aria-label="Close"></a>
      <form class="popup popup--add" action="#" style="--pw:365px;--ph:300px">
        <div class="popup__box"></div>
        <label class="txt fs-20 f-bold c-dark" for="category" style="--x:36px;--y:34px">Category</label>
        <select class="select" id="category" name="category" required style="--x:169px;--y:27px;--w:149px;--h:40px">
          <option value="" disabled selected>Select</option>
          <option>Food</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>
        <img class="abs abs--ghost rot-180" src="assets/select-arrow.svg" alt="" style="--x:287px;--y:43px;--w:17.64px;--h:11.75px">

        <label class="txt fs-20 f-bold c-dark" for="price" style="--x:36px;--y:86px">Price</label>
        <input class="field field--green" id="price" name="price" type="text" inputmode="numeric" required style="--x:36px;--y:114px;--w:282px;--h:40px">

        <label class="txt fs-20 f-bold c-dark" for="date" style="--x:36px;--y:159px">Date</label>
        <input class="field field--green" id="date" name="date" type="date" required style="--x:36px;--y:186px;--w:282px;--h:40px">

        <button class="btn-green" type="submit" style="--x:108px;--y:242px">Add</button>
      </form>
    </div>
  </main>
</body>
</html>
