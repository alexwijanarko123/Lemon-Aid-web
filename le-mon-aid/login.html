<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Le Mon-Aid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="screen__bg"></div>
    <div class="logo" style="--x:158px;--y:17px;--w:125px;--h:125px"><img src="assets/logo.png" alt="Le Mon-Aid logo"></div>
    <div class="panel" style="--y:142px;--h:517px"></div>
    <h1 class="brand" style="--x:101px;--y:170px">Le Mon-Aid</h1>
    <h2 class="txt fs-25 f-heavy c-ink" style="--x:150px;--y:278px">Login Here</h2>

    <form action="home.html">
      <label class="sr-only" for="username">Username</label>
      <input class="field" id="username" name="username" type="text" placeholder="Username" autocomplete="username" style="--x:45px;--y:336px">

      <label class="sr-only" for="password">Password</label>
      <input class="field" id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" style="--x:45px;--y:408px">

      <a class="txt fs-14 f-med c-brown ls" href="#" style="--x:45px;--y:468px">Forget password?</a>

      <button class="btn" type="submit" style="--x:60px;--y:520px">Login</button>
    </form>

    <div class="leaf" style="--x:314px;--y:481px"><img src="assets/logo.png" alt=""></div>

    <p class="txt fs-14" style="--x:96px;--y:594px"><span class="f-med c-brown">Don’t have account yet? </span><a class="f-bold c-orange" href="register.html">Register here</a></p>
  </main>
</body>
</html>
