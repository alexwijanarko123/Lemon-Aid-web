<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financial info · Le Mon-Aid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="screen__bg"></div>
    <div class="panel" style="--h:615px"></div>
    <h1 class="brand">Le Mon-Aid</h1>
    <p class="plan">FREE PLAN</p>
    <div class="logo"><img src="assets/logo.png" alt="Le Mon-Aid logo"></div>

    <div class="card card--sheet" style="--x:30px;--y:169px;--w:380px;--h:432px"></div>
    <h2 class="txt fs-25 f-bold c-brown" style="--x:138px;--y:214px">Financial info</h2>

    <form action="home.html">
      <label class="txt fs-14 f-bold c-brown" for="income" style="--x:54px;--y:263px">Your money income per month <span class="req">*</span></label>
      <input class="field field--lime" id="income" name="income" type="text" inputmode="numeric" required style="--x:54px;--y:288px;--w:330px;--h:40px">

      <label class="txt fs-14 f-bold c-brown" for="shopping-budget" style="--x:54px;--y:333px">Your budget for shopping</label>
      <input class="field field--lime" id="shopping-budget" name="shopping-budget" type="text" inputmode="numeric" style="--x:54px;--y:358px;--w:330px;--h:40px">

      <label class="txt fs-14 f-bold c-brown" for="saving-target" style="--x:54px;--y:403px">Your saving target</label>
      <input class="field field--lime" id="saving-target" name="saving-target" type="text" inputmode="numeric" style="--x:54px;--y:428px;--w:330px;--h:40px">

      <button class="btn btn--bold btn--outline btn--shadow" type="submit" style="--x:53px;--y:516.44px;--w:333.15px">Submit</button>
    </form>

    <div class="leaf" style="--x:313px;--y:478px;--w:71.863px"><img src="assets/logo.png" alt=""></div>
  </main>
</body>
</html>
