<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · Le Mon-Aid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="screen__bg"></div>
    <div class="panel"></div>
    <h1 class="brand">Le Mon-Aid</h1>
    <p class="plan">FREE PLAN</p>
    <div class="logo"><img src="assets/logo.png" alt="Le Mon-Aid logo"></div>

    <p class="txt fs-12 f-heavy c-ink" style="--x:37px;--y:203px">Hello,</p>
    <p class="txt fs-25 f-heavy c-ink" style="--x:37px;--y:219px">Alexander</p>

    <!-- Balance -->
    <div class="card card--gradient" style="--x:37px;--y:262px;--h:90px"></div>
    <p class="txt fs-14 f-bold c-brown" style="--x:55px;--y:277px">Your Balance</p>
    <p class="txt fs-25 f-heavy c-brown" style="--x:55px;--y:299px">Rp. 1.234.567.890</p>

    <!-- Wanna buy something? -->
    <div class="card card--butter card--amber" style="--x:37px;--y:379px;--h:122px"></div>
    <p class="txt fs-14 f-heavy c-orange" style="--x:55px;--y:393px">Wanna buy something?</p>
    <a class="btn btn--shadow" href="mini-survey.html" style="--x:59px;--y:428px">Yes</a>
    <div class="leaf" style="--x:313px;--y:389px"><img src="assets/logo.png" alt=""></div>

    <!-- Recent purchases -->
    <div class="card card--lime" style="--x:37px;--y:530px;--h:286px"></div>
    <h2 class="bar bar--green" style="--y:543px">Recent Purchases</h2>
    <ul class="rows" style="--y:584px">
      <li><span>Food</span><time datetime="2025-12-16">16 December 2025</time><span>Rp 1.000.000</span><img class="rule" src="assets/line-home.svg" alt=""></li>
      <li><span>Food</span><time datetime="2025-12-07">7 December 2025</time><span>Rp 700.000</span><img class="rule" src="assets/line-home.svg" alt=""></li>
      <li><span>Food</span><time datetime="2025-11-29">29 November 2025</time><span>Rp 30.000</span><img class="rule" src="assets/line-home.svg" alt=""></li>
    </ul>
    <a class="txt fs-14 f-bold c-green" href="history.html" style="--x:271px;--y:787px">View full history</a>

    <nav class="tabbar tabbar--label-45" aria-label="Main">
      <a class="tab tab--home" href="home.html" aria-current="page"><img src="assets/nav-home-active.svg" alt=""><span class="tab__label">Home</span></a>
      <a class="tab tab--saving" href="saving.html"><img src="assets/nav-saving.svg" alt=""><span class="tab__label">Saving</span></a>
      <a class="tab tab--timer" href="timer.html"><img src="assets/nav-timer.svg" alt=""><span class="tab__label">Timer</span></a>
      <a class="tab tab--profile" href="profile.html"><img src="assets/nav-profile.svg" alt=""><span class="tab__label">Profile</span></a>
    </nav>
  </main>
</body>
</html>
