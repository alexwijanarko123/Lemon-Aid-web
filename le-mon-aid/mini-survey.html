<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Survey · Le Mon-Aid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="screen__bg"></div>
    <div class="panel"></div>
    <h1 class="brand">Le Mon-Aid</h1>
    <p class="plan">FREE PLAN</p>
    <div class="logo"><img src="assets/logo.png" alt="Le Mon-Aid logo"></div>

    <div class="card card--sheet" style="--x:30px;--y:169px;--w:380px;--h:753px"></div>
    <h2 class="txt fs-25 f-bold c-brown" style="--x:146px;--y:198px">Mini Survey</h2>
    <a class="abs close" href="home.html" aria-label="Close" style="--x:353px;--y:185px;--w:40px;--h:40px"><img src="assets/close-mini-survey.svg" alt=""></a>

    <form action="gemini.html">
      <label class="txt fs-14 f-bold c-brown" for="item" style="--x:54px;--y:263px">What Item do you want to buy? <span class="req">*</span></label>
      <input class="field field--lime" id="item" name="item" type="text" required style="--x:54px;--y:288px;--w:330px;--h:40px">

      <label class="txt fs-14 f-bold c-brown" for="price" style="--x:54px;--y:333px">How much is the price? <span class="req">*</span></label>
      <input class="field field--lime" id="price" name="price" type="text" inputmode="numeric" required style="--x:54px;--y:358px;--w:330px;--h:40px">

      <label class="txt fs-14 f-bold c-brown" for="similar" style="--x:54px;--y:403px">Do you have any items that have similar purpose? <span class="req">*</span></label>
      <input class="field field--lime" id="similar" name="similar" type="text" required style="--x:53px;--y:428px;--w:330px;--h:40px">

      <label class="txt fs-14 f-bold c-brown" for="when" style="--x:54px;--y:473px">When are you planning to buy?</label>
      <input class="field field--lime" id="when" name="when" type="text" style="--x:54px;--y:498px;--w:330px;--h:40px">

      <label class="txt fs-14 f-bold c-brown" for="reason" style="--x:55px;--y:543px">Reason to buy <span class="req">*</span></label>
      <textarea class="field field--lime" id="reason" name="reason" required style="--x:53px;--y:568px;--w:330px;--h:150px"></textarea>

      <label class="txt fs-14 f-bold c-brown" for="link" style="--x:53px;--y:723px">Product link</label>
      <input class="field field--lime" id="link" name="link" type="url" style="--x:53px;--y:748px;--w:330px;--h:40px">

      <button class="btn btn--bold btn--outline btn--shadow" type="submit" style="--x:53px;--y:834.44px;--w:333.15px">Let’s ask Gemini</button>
    </form>

    <div class="leaf" style="--x:313px;--y:796px;--w:71.863px"><img src="assets/logo.png" alt=""></div>
    <p class="txt fs-10 f-bold c-brown" style="--x:170px;--y:899px">Daily usage limit : 1/1</p>
  </main>
</body>
</html>
