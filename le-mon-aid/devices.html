<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Device · Le Mon-Aid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="screen__bg"></div>
    <div class="panel"></div>
    <h1 class="brand">Le Mon-Aid</h1>
    <p class="plan">FREE PLAN</p>
    <div class="logo"><img src="assets/logo.png" alt="Le Mon-Aid logo"></div>

    <a class="back" href="profile.html" aria-label="Back to profile" style="--x:66px;--y:199px"><img src="assets/arrow-back.svg" alt=""></a>
    <h2 class="txt fs-25 f-heavy c-ink" style="--x:142px;--y:200px">Manage Device</h2>

    <!-- This device -->
    <div class="card card--butter card--r10" style="--x:38px;--y:277px;--h:100px"></div>
    <img class="abs" src="assets/map-location.svg" alt="" style="--x:55px;--y:296px;--w:60px;--h:60px">
    <p class="txt fs-14 f-heavy c-brown" style="--x:142px;--y:286px">Iphone 17 Pro Max</p>
    <p class="txt fs-14 f-bold c-gold" style="--x:142px;--y:309px">Jakarta, Indonesia</p>
    <p class="txt fs-14 f-bold c-gold" style="--x:142px;--y:346px">Now</p>
    <a class="txt fs-14 f-bold c-gold" href="login.html" style="--x:340px;--y:346px">Logout</a>

    <!-- Other device -->
    <div class="card card--butter card--r10" style="--x:36px;--y:400px;--h:100px"></div>
    <img class="abs" src="assets/map-location.svg" alt="" style="--x:55px;--y:420px;--w:60px;--h:60px">
    <p class="txt fs-14 f-heavy c-brown" style="--x:140px;--y:413px">Samsung Galaxy S26 Ultra</p>
    <p class="txt fs-14 f-bold c-gold" style="--x:140px;--y:436px">Bandung, Indonesia</p>
    <p class="txt fs-14 f-bold c-gold" style="--x:140px;--y:470px">6 days ago</p>
    <a class="txt fs-14 f-bold c-gold" href="login.html" style="--x:340px;--y:470px">Logout</a>

    <nav class="tabbar" aria-label="Main">
      <a class="tab tab--home" href="home.html"><img src="assets/nav-home.svg" alt=""><span class="tab__label">Home</span></a>
      <a class="tab tab--saving" href="saving.html"><img src="assets/nav-saving.svg" alt=""><span class="tab__label">Saving</span></a>
      <a class="tab tab--timer" href="timer.html"><img src="assets/nav-timer.svg" alt=""><span class="tab__label">Timer</span></a>
      <a class="tab tab--profile" href="profile.html" aria-current="page"><img src="assets/nav-profile-active.svg" alt=""><span class="tab__label">Profile</span></a>
    </nav>
  </main>
</body>
</html>
