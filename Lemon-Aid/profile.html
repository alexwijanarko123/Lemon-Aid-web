<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Mon-Aid - Profile</title>
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="profile.css">
</head>
<body>
<div class="phone">
  <main class="screen profile-screen">
    <div class="brand">
      <img class="brand-logo" src="../images/logo.png" alt="Le Mon-Aid Logo">
      <div>
        <h1>Le Mon-Aid</h1>
        <span class="plan-badge">FREE PLAN</span>
      </div>
    </div>

    <!-- User Info Card -->
    <div class="user-card">
      <div class="avatar-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="#20451a">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </div>
      <div class="user-details">
        <h2 id="username" class="user-name">Username</h2>
        <p id="email" class="user-email">email@example.com</p>
      </div>
    </div>

    <!-- Upgrade Banner -->
    <a href="#" class="upgrade-banner" id="upgrade-plan" role="button">
      <span class="flower-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffec8b">
          <circle cx="12" cy="7" r="4" fill="#ffec8b"/>
          <circle cx="7" cy="14" r="4" fill="#ffec8b"/>
          <circle cx="17" cy="14" r="4" fill="#ffec8b"/>
          <circle cx="12" cy="12" r="2.5" fill="#e69500"/>
        </svg>
      </span>
      <span class="upgrade-text">Upgrade your plan</span>
    </a>

    <!-- More Menu Section -->
    <p class="more-title">More</p>
    <ul class="profile-menu">
      <li>
        <a href="editprofile.html" class="menu-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#4a3512" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span>Edit profile</span>
        </a>
      </li>
      <li>
        <a href="managelogin.html" class="menu-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#4a3512" aria-hidden="true">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
          </svg>
          <span>Manage device</span>
        </a>
      </li>
      <li>
        <a href="help.html" class="menu-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#4a3512" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
          </svg>
          <span>FAQ</span>
        </a>
      </li>
      <li>
        <a href="mailto:jonathan.saputra003@binus.ac.id?subject=Le%20Mon-Aid%20Support" class="menu-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#4a3512" aria-hidden="true">
            <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          <span>Call Customer Service</span>
        </a>
      </li>
    </ul>

    <button class="logout" id="logout" type="button">Log Out</button>
  </main>
</div>

<script src="navbar.js"></script>
<script src="api.js"></script>
<script src="profile.js"></script>
</body>
</html>
