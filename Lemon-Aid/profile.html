<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Mon-Aid - Profile</title>
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="finance.css">
<link rel="stylesheet" href="profile.css">
</head>
<body>
<div class="phone">
  <main class="screen">
    <div class="brand"><h1>Le Mon-Aid</h1><span>free plan</span></div>

    <a class="back" href="homepage.html" aria-label="Kembali ke Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10 5l-7 7 7 7"/></svg>
    </a>

    <div class="hello-pill">
      <svg class="avatar" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="20" cy="16" r="6.5" fill="#000"/><path d="M8 33c2-7 7-9 12-9s10 2 12 9c-3 3-7 5-12 5s-9-2-12-5z" fill="#000"/></svg>
      <p>Hello<br><span id="username">Username</span></p>
      <button id="eye" type="button" aria-pressed="false" aria-label="Sembunyikan nominal uang">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
      </button>
    </div>

    <div class="stats">
      <div class="stat"><span class="ico" aria-hidden="true">💰</span><div>Monthly Income<b id="f-income"></b></div></div>
      <div class="stat"><span class="ico" aria-hidden="true">🛒</span><div>Spending Budget<b id="f-budget"></b></div></div>
      <div class="stat wide"><span class="ico" aria-hidden="true">🛒</span><div>Remaining Available Spending Budget<b id="f-remaining"></b></div></div>
    </div>

    <p class="more">More</p>
    <ul class="menu">
      <li><a href="#"><span class="mi" aria-hidden="true">✎</span>Edit Profile</a></li>
      <li><a href="#"><span class="mi" aria-hidden="true">🕘</span>Shopping History</a></li>
      <li><a href="#"><span class="mi" aria-hidden="true">❓</span>Help &amp; Support</a></li>
      <li><a href="#"><span class="mi" aria-hidden="true">🛡️</span>Manage Login</a></li>
      <li><a href="#"><span class="mi" aria-hidden="true">📞</span>Call Customer Service</a></li>
    </ul>

    <button class="logout" id="logout" type="button">Log Out</button>
  </main>
</div>

<script src="navbar.js"></script>
<script src="finance.js"></script>
<script src="profile.js"></script>
</body>
</html>
