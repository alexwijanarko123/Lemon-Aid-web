<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Mon-Aid - Complete Profile</title>
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="completeprofile.css">
</head>
<body>
<div class="phone">
  <main class="screen">
    <div class="brand">
      <img class="brand-logo" src="../images/logo.png" alt="Logo">
      <div><h1>Le Mon-Aid</h1><span>free plan</span></div>
    </div>

    <h2 class="page-title">Financial Info</h2>
    <form id="profileForm" novalidate>
      <div class="section-card">
        <h3>Financial Information</h3>
        
        <label for="income">Your Money Income per month</label>
        <input type="text" id="income" inputmode="numeric" placeholder="e.g. 5.000.000" required>

        <label for="budget">Your Budget For shopping</label>
        <input type="text" id="budget" inputmode="numeric" placeholder="e.g. 3.000.000">

        <label for="target">Your Savings Target</label>
        <input type="text" id="target" inputmode="numeric" placeholder="e.g. 10.000.000">
      </div>

      <p id="errorMessage" class="error-msg" role="alert"></p>

      <button type="submit" class="savechange">Submit</button>
    </form>
  </main>
</div>

<script src="navbar.js"></script>
<script src="finance.js"></script>
<script src="api.js"></script>
<script src="completeprofile.js"></script>
</body>
</html>
