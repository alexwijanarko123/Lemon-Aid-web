<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Mon-Aid - Change Password</title>
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="editprofile.css">
</head>
<body>
<div class="phone">
  <main class="screen">
    <div class="brand">
      <img class="brand-logo" src="../images/logo.png" alt="Logo">
      <div><h1>Le Mon-Aid</h1><span>free plan</span></div>
    </div>

    <a class="back-link" href="editprofile.html" aria-label="Back to Edit Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12H4M10 5l-7 7 7 7"/>
      </svg>
    </a>

    <h2 class="page-title">Change Password</h2>

    <form id="change-password-form" method="post" novalidate>
      <div class="section-card">
 

        <label for="current-password">Current Password</label>
        <input type="password" id="current-password" name="current-password" placeholder="Enter current password" required>

        <label for="new-password">New Password</label>
        <input type="password" id="new-password" name="new-password" placeholder="Min. 8 characters" required>

        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter new password" required>
      </div>

      <p id="errorMessage" class="error-msg" role="alert"></p>

      <button type="submit" class="savechange">Save Changes</button>
    </form>
  </main>
</div>

<script src="navbar.js"></script>
<script src="api.js"></script>
<script src="changepassword.js"></script>
</body>
</html>
