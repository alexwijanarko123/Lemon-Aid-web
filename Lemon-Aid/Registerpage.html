<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="registerpage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Le Mon-Aid</h1>
        </div>

        <div class="register">
            <h2>Register Here</h2>
            
            <!-- Tambahkan novalidate agar HTML tidak menyekat JS -->
            <form method="post" novalidate>
                <input type="text" id="username" name="username" placeholder="Username"><br>
                <input type="email" id="email" name="email" placeholder="Email"><br>
                <input type="password" id="password" name="password" placeholder="Password"><br>
                <input type="password" id="confirmPassword" name="confirmpassword" placeholder="Confirm Password"><br>
                
                <div class="gender">
                    <label for="gender">Gender:</label>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                    <input type="radio" name="gender" value="other"> Other
                </div>
                <!-- TAMBAHKAN id="password" DAN id="confirmPassword" DI SINI -->
                <input class="register-btn" type="submit" value="Register">
                <!-- SAMAKAN id="errorMessage" DENGAN JS -->
                <p id="errorMessage" class="errorMessage"></p>

            </form>
        </div>
        <p>Already have an account? <a href="loginpage.html">Login here</a></p>
    </div>
    <script src="registerpage.js"></script>
</body>
</html>
