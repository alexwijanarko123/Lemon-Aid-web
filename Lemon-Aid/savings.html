<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Mon-Aid - Savings</title>
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="finance.css">
<link rel="stylesheet" href="savings.css">
</head>
<body>
<div class="phone">
  <main class="screen">
    <div class="brand">
      <img class="brand-logo" src="../images/logo.png" alt="">
      <div><h1>Le Mon-Aid</h1><span>free plan</span></div>
    </div>
    <h2 class="title">Your Financial Tracker</h2>

    <div class="stats">
      <div class="stat"><span class="ico" aria-hidden="true">💰</span><div>Monthly Income<b id="f-income"></b></div></div>
      <div class="stat"><span class="ico" aria-hidden="true">🛒</span><div>Spending Budget<b id="f-budget"></b></div></div>
      <div class="stat wide"><span class="ico" aria-hidden="true">🛒</span><div>Remaining Available Spending Budget<b id="f-remaining"></b></div></div>
    </div>

    <div class="duo">
      <div class="tile">
        <b>Shopping Money saved</b>
        <div class="row"><span class="big" aria-hidden="true">🏦</span>
          <div><b id="s-saved"></b><span id="s-progress">Progress : ...%</span></div></div>
      </div>
      <div class="tile">
        <b>Target</b>
        <div class="row"><span class="big" aria-hidden="true">🎯</span>
          <b id="s-target"></b></div>
      </div>
    </div>

    <section class="chart-card" aria-label="Pengeluaran bulan ini">
      <h3>Your Spending This Month</h3>
      <div class="chart-row">
        <svg id="donut" viewBox="0 0 120 120" role="img" aria-label="Diagram donat pengeluaran"></svg>
        <ul class="legend" id="legend"></ul>
      </div>
      <button class="add-Spending-btn" id="AddSpending">Add Spending</button>
    </section>
  </main>

  <!-- Pop Up Add Spending -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-field">
        <label for="spendCategory">Category</label>
        <select id="spendCategory">
          <option value="" disabled selected>Select</option>
          <option value="food">Food</option>
          <option value="shopping">Shopping</option>
          <option value="others">Others</option>
        </select>
      </div>
      <div class="popup-field">
        <label for="spendPrice">Price</label>
        <input type="text" id="spendPrice" placeholder="0" inputmode="numeric" />
      </div>
      <div class="popup-field">
        <label for="spendDate">Date</label>
        <input type="date" id="spendDate" />
      </div>
      <button class="popup-add-btn" id="popupAddBtn">Add</button>
    </div>
  </div>
</div>

<script src="navbar.js"></script>
<script src="finance.js"></script>
<script src="api.js"></script>
<script src="savings.js"></script>
</body>
</html>
