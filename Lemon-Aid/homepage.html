<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Mon-Aid - Home</title>
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="homepage.css">
</head>
<body>
<div class="phone">
  <main class="screen">
    <div class="brand">
      <img class="brand-logo" src="../images/logo.png" alt="">
      <div><h1>Le Mon-Aid</h1><span>free plan</span></div>
    </div>

    <p class="hello">Hello,</p>
    <p class="username" id="username">Username</p>
    <div class="balance">Your Balance<strong id="balance"></strong>Keep it up</div>

  <form id="search-form">
   <input id="link-input" type="url" placeholder="Link toko / merchant online" aria-label="Link toko" autocomplete="off">
   <label>Gambar barang
    <input id="image-input" type="file" accept="image/*">
    </label>
    <img id="image-preview" alt="Pratinjau gambar barang" hidden style="max-width:100%;max-height:120px">
    <button type="submit">Lanjut</button>
  </form>
    <p class="error" id="search-error" role="alert"></p>

    <div class="recent-purchases-card">
      <div class="recent-purchases-header">Recent Purchases</div>
      <div class="recent-purchases-list" id="recent-purchases-list">
        <div class="purchase-row">
          <span class="p-category">Food</span>
          <span class="p-date">16 December 2025</span>
          <span class="p-amount">Rp 1.000.000</span>
        </div>
        <div class="purchase-row">
          <span class="p-category">Food</span>
          <span class="p-date">7 December 2025</span>
          <span class="p-amount">Rp 700.000</span>
        </div>
        <div class="purchase-row">
          <span class="p-category">Food</span>
          <span class="p-date">29 November 2025</span>
          <span class="p-amount">Rp 30.000</span>
        </div>
      </div>
      <div class="recent-purchases-footer">
        <a href="shoppinghistory.html" class="view-history">View full history</a>
      </div>
    </div>
  </main>
</div>

<script src="navbar.js"></script>
<script src="finance.js"></script>
<script src="homepage.js"></script>
</body>
</html>
