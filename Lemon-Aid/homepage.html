<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Mon-Aid - Home</title>
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="homepage.css">
</head>
<body>
<div class="phone">
  <main class="screen">
    <div class="brand">
      <img class="brand-logo" src="../images/logo.png" alt="">
      <div><h1>Le Mon-Aid</h1><span>free plan</span></div>
    </div>

    <p class="hello">Hello,</p>
    <p class="username" id="username">Username</p>
    <div class="balance">Your Balance<strong id="balance">Rp.5.000.000,-</strong>Keep it up</div>

  <form id="search-form">
   <input id="link-input" type="url" placeholder="Link toko / merchant online" aria-label="Link toko" autocomplete="off">
   <label>Gambar barang
    <input id="image-input" type="file" accept="image/*">
    </label>
    <img id="image-preview" alt="Pratinjau gambar barang" hidden style="max-width:100%;max-height:120px">
    <button type="submit">Lanjut</button>
  </form>
    <p class="error" id="search-error" role="alert"></p>

    <div class="insight">
      <div class="row">
        <svg width="38" height="38" viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset=".5" stop-color="#9b72cb"/><stop offset="1" stop-color="#34a853"/></linearGradient></defs><path fill="url(#g)" d="M12 1c.6 5.6 5.4 10.4 11 11-5.6.6-10.4 5.4-11 11-.6-5.6-5.4-10.4-11-11C6.6 11.4 11.4 6.6 12 1z"/></svg>
        AI Insight
      </div>
      <p id="insight-text">Masukkan link produk, nanti AI bantu cek apakah kamu benar-benar butuh barang itu.</p>
    </div>
  </main>
</div>

<script src="navbar.js"></script>
<script src="homepage.js"></script>
</body>
</html>
